<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324D"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PFMP JDP">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><title>PFMP JDP</title>
<style>
:root{--b:#17324D;--b2:#285B80;--bg:#F3F5F7;--w:#fff;--t:#18232D;--m:#687782;--l:#DCE3E8;--g:#D89B00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;padding:20px 16px 22px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px #0002}header div,main{max-width:1000px;margin:auto}h1{margin:0;font-size:24px}header p{margin:4px 0 0;opacity:.84;font-size:14px}
main{padding:14px 14px 92px}.view{display:none}.view.active{display:block}.search{background:#fff;border:1px solid var(--l);border-radius:15px;padding:11px}.search input{width:100%;border:0;outline:0;font-size:17px;padding:5px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}select{width:100%;padding:12px;border:1px solid var(--l);border-radius:11px;background:#fff;color:var(--t);font:inherit}
.tools{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}.pill,.mapbtn{border:1px solid var(--l);background:#fff;border-radius:999px;padding:9px 12px;cursor:pointer;font:inherit}.pill.active{background:var(--b);color:#fff}
.status{display:flex;justify-content:space-between;align-items:center;color:var(--m);font-size:14px;margin:12px 2px}.grid{display:grid;grid-template-columns:1fr;gap:10px}
.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:14px;box-shadow:0 1px 4px #00000008}.top{display:flex;gap:10px;justify-content:space-between}.identity{display:flex;gap:11px;min-width:0}
.logo{width:52px;height:52px;border-radius:11px;border:1px solid var(--l);object-fit:contain;background:#fff;flex:none}.name{font-size:17px;font-weight:750;line-height:1.25}.activity{font-size:13px;color:var(--b2);font-weight:650;margin-top:4px}.place{font-size:13px;color:var(--m);margin-top:6px}
.star{border:0;background:none;font-size:27px;cursor:pointer;color:#9BA4AB}.star.on{color:var(--g)}.card-actions{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:7px;margin-top:12px}
.card-actions button,.card-actions a,.actions a{border:1px solid var(--l);border-radius:10px;padding:9px;text-align:center;background:#fff;color:var(--b);text-decoration:none;font-weight:650;cursor:pointer;font:inherit}.primary{background:var(--b)!important;color:#fff!important;border-color:var(--b)!important}
.empty,.loading{background:#fff;border:1px dashed var(--l);border-radius:16px;padding:34px;text-align:center;color:var(--m)}
.detail .back{border:0;background:none;color:var(--b);font-weight:700;padding:6px 0 12px;cursor:pointer;font:inherit}.detail-card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:18px}.detail-card h2{margin:0 40px 5px 0;font-size:23px}.label{font-size:12px;color:var(--m);margin-top:17px}.value{margin-top:3px;font-size:15px;line-height:1.45}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
#map{height:calc(100vh - 285px);min-height:500px;border-radius:16px;border:1px solid var(--l);z-index:1}.map-tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.mapbtn{border-radius:10px;font-weight:700;color:var(--b)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);display:flex;justify-content:center;gap:45px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));z-index:30}nav button{border:0;background:none;color:var(--b);font-weight:750;font:inherit;cursor:pointer}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr 1fr}#map{height:650px}}
</style></head><body>
<header><div><h1>PFMP JDP</h1><p>Recherche d'entreprises pour les PFMP</p></div></header><main>
<section id="companiesView" class="view active">
<div class="search"><input id="q" placeholder="🔎 Nom, activité, ville, code postal…" autocomplete="off"></div>
<div class="filters"><select id="city"><option value="">📍 Toutes les villes</option></select><select id="activity"><option value="">🏢 Tous les secteurs</option></select></div>
<div class="tools"><button class="pill" id="favOnly">☆ Favoris uniquement</button><select id="sort" style="max-width:220px"><option value="name">Trier par nom</option><option value="city">Trier par ville</option><option value="activity">Trier par secteur</option></select></div>
<div class="status"><span id="count">Chargement…</span><button class="pill" id="reset">Réinitialiser</button></div><div id="cards" class="grid"><div class="loading">Chargement…</div></div>
</section>
<section id="mapView" class="view"><div class="map-tools"><button class="mapbtn" id="locate">📍 Me localiser</button><button class="mapbtn" id="mapAll">🌍 Toutes les entreprises</button></div><div id="map"></div></section>
<section id="detailView" class="view detail"><button class="back" id="back">← Retour aux entreprises</button><div id="detail"></div></section>
</main><nav><button id="homeBtn">🏢 Entreprises</button><button id="mapBtn">🗺️ Carte</button><button id="favoritesBtn">⭐ Favoris</button></nav>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let companies=[],favorites=[],favMode=false,map=null,layer=null,userMarker=null;try{favorites=JSON.parse(localStorage.getItem("pfmp-favorites")||"[]")}catch(e){}
const $=id=>document.getElementById(id);function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function save(){try{localStorage.setItem("pfmp-favorites",JSON.stringify(favorites))}catch(e){}}function isFav(id){return favorites.includes(id)}
function toggleFav(id){favorites=isFav(id)?favorites.filter(x=>x!==id):[...favorites,id];save();render();if(map)renderMap()}
function parseCSV(t){let rows=[],row=[],cell="",q=false;t=t.replace(/^\\uFEFF/,"");for(let i=0;i<t.length;i++){let ch=t[i],nx=t[i+1];if(ch==='"'&&q&&nx==='"'){cell+='"';i++;continue}if(ch==='"'){q=!q;continue}if(ch===";"&&!q){row.push(cell);cell="";continue}if((ch==="\\n"||ch==="\\r")&&!q){if(ch==="\\r"&&nx==="\\n")i++;row.push(cell);cell="";if(row.some(v=>v.trim()))rows.push(row);row=[];continue}cell+=ch}if(cell!==""||row.length){row.push(cell);if(row.some(v=>v.trim()))rows.push(row)}let h=rows.shift().map(x=>x.trim());return rows.map(r=>{let o={};h.forEach((x,i)=>o[x]=(r[i]||"").trim());return o})}
function adapt(r){let m=String(r.Coordinates||"").match(/^\\s*(-?\\d+(?:\\.\\d+)?)\\s*,\\s*(-?\\d+(?:\\.\\d+)?)\\s*$/);return{id:r.ID,name:r["Raison Sociale"],activity:r["Activité"],address:r.Adresse,city:r["Secteur géographique"],postal:r["CODE POSTAL"],responsible:r["Responsable de l'entreprise"],phone:r["Téléphone entreprise"],email:r.Mail,website:r["Site internet de l'entreprise"],logo:r.Logo,lat:m?+m[1]:null,lon:m?+m[2]:null}}
async function load(){try{let r=await fetch("data/entreprises.csv?"+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;companies=parseCSV(await r.text()).map(adapt).filter(c=>c.id&&c.name);[...new Set(companies.map(c=>c.city).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"fr")).forEach(x=>{let o=document.createElement("option");o.value=x;o.textContent="📍 "+x;$("city").appendChild(o)});[...new Set(companies.map(c=>c.activity).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"fr")).forEach(x=>{let o=document.createElement("option");o.value=x;o.textContent="🏢 "+x;$("activity").appendChild(o)});render()}catch(e){$("count").textContent="Erreur de chargement";$("cards").innerHTML='<div class="empty">Impossible de charger la base.</div>'}}
function filtered(){let q=$("q").value.trim().toLowerCase(),ci=$("city").value,ac=$("activity").value,a=companies.filter(c=>(!q||[c.name,c.activity,c.address,c.city,c.postal].join(" ").toLowerCase().includes(q))&&(!ci||c.city===ci)&&(!ac||c.activity===ac)&&(!favMode||isFav(c.id)));let k=$("sort").value;a.sort((x,y)=>{let ax=k==="name"?x.name:k==="city"?x.city:x.activity,ay=k==="name"?y.name:k==="city"?y.city:y.activity;return String(ax||"").localeCompare(String(ay||""),"fr")});return a}
function logo(c){return c.logo?`<img class="logo" src="${esc(c.logo)}" alt="" loading="lazy" onerror="this.style.display='none'">`:""}
function render(){let a=filtered();$("count").textContent=`${a.length} entreprise${a.length>1?"s":""}`;$("cards").innerHTML=a.length?a.map(c=>`<article class="card"><div class="top"><div class="identity">${logo(c)}<div><div class="name">${esc(c.name)}</div><div class="activity">${esc(c.activity)}</div><div class="place">📍 ${esc(c.city)} ${esc(c.postal)}</div></div></div><button class="star ${isFav(c.id)?"on":""}" onclick="toggleFav('${esc(c.id)}')">${isFav(c.id)?"★":"☆"}</button></div><div class="card-actions"><button class="primary" onclick="openDetail('${esc(c.id)}')">Voir la fiche</button>${c.phone?`<a href="tel:${esc(c.phone)}">📞 Appeler</a>`:""}${c.email?`<a href="mailto:${esc(c.email)}">✉️ E-mail</a>`:""}</div></article>`).join(""):'<div class="empty">Aucune entreprise ne correspond.</div>'}
function openDetail(id){let c=companies.find(x=>x.id===id);if(!c)return;show("detailView");let maps=c.lat&&c.lon?`https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lon}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((c.address||"")+" "+(c.city||""))}`;let web=c.website?`<a target="_blank" rel="noopener" href="${esc(/^https?:\\/\\//i.test(c.website)?c.website:"https://"+c.website)}">🌐 Site internet</a>`:"";$("detail").innerHTML=`<div class="detail-card"><div class="top"><div class="identity">${logo(c)}<div><h2>${esc(c.name)}</h2><div class="activity">${esc(c.activity)}</div></div></div><button class="star ${isFav(c.id)?"on":""}" onclick="toggleFav('${esc(c.id)}');openDetail('${esc(c.id)}')">${isFav(c.id)?"★":"☆"}</button></div><div class="label">Adresse</div><div class="value">${esc(c.address)}<br>${esc(c.postal)} ${esc(c.city)}</div><div class="label">Responsable</div><div class="value">${esc(c.responsible)||"Non renseigné"}</div><div class="label">Téléphone</div><div class="value">${c.phone?`<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>`:"Non renseigné"}</div><div class="label">E-mail</div><div class="value">${c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:"Non renseigné"}</div><div class="actions">${c.phone?`<a class="primary" href="tel:${esc(c.phone)}">📞 Appeler</a>`:""}${c.email?`<a class="primary" href="mailto:${esc(c.email)}">✉️ Envoyer un e-mail</a>`:""}<a href="${maps}" target="_blank" rel="noopener">📍 Itinéraire</a>${web}</div></div>`}
function show(v){["companiesView","mapView","detailView"].forEach(x=>$(x).classList.remove("active"));$(v).classList.add("active");window.scrollTo(0,0);if(v==="mapView")setTimeout(()=>{initMap();renderMap()},50)}
function initMap(){if(map)return;map=L.map("map");L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);layer=L.layerGroup().addTo(map);map.setView([43.95,1.35],10)}
function renderMap(){if(!map)return;layer.clearLayers();let b=[];filtered().forEach(c=>{if(c.lat==null||c.lon==null)return;let m=L.marker([c.lat,c.lon]).addTo(layer);m.bindPopup(`<b>${esc(c.name)}</b><br>${esc(c.activity)}<br>📍 ${esc(c.city)}<br><button onclick="openDetail('${esc(c.id)}')">Voir la fiche</button>`);b.push([c.lat,c.lon])});if(b.length)map.fitBounds(b,{padding:[25,25],maxZoom:13})}
function locate(){if(!navigator.geolocation){alert("Géolocalisation indisponible.");return}navigator.geolocation.getCurrentPosition(p=>{let x=[p.coords.latitude,p.coords.longitude];if(userMarker)userMarker.remove();userMarker=L.circleMarker(x,{radius:9}).addTo(map).bindPopup("📍 Vous êtes ici").openPopup();map.setView(x,12)},()=>alert("Autorise la localisation dans ton navigateur."),{enableHighAccuracy:true,timeout:10000})}
$("homeBtn").onclick=()=>{favMode=false;show("companiesView");render()};$("mapBtn").onclick=()=>show("mapView");$("favoritesBtn").onclick=()=>{favMode=true;$("favOnly").classList.add("active");show("companiesView");render()};$("back").onclick=()=>show("companiesView");
$("favOnly").onclick=()=>{favMode=!favMode;$("favOnly").classList.toggle("active",favMode);$("favOnly").textContent=favMode?"★ Tous les résultats":"☆ Favoris uniquement";render()};$("reset").onclick=()=>{$("q").value="";$("city").value="";$("activity").value="";$("sort").value="name";favMode=false;$("favOnly").classList.remove("active");$("favOnly").textContent="☆ Favoris uniquement";render()};["q","city","activity","sort"].forEach(id=>$(id).addEventListener("input",()=>{render();if(map)renderMap()}));$("locate").onclick=locate;$("mapAll").onclick=()=>{if(map){let b=companies.filter(c=>c.lat!=null).map(c=>[c.lat,c.lon]);if(b.length)map.fitBounds(b,{padding:[25,25],maxZoom:12})}};load();
</script></body></html>
