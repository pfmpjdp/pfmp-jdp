<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16324F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PFMP Stage">
<link rel="manifest" href="manifest.webmanifest">
<title>PFMP Stage — Test</title>
<style>
:root{--blue:#16324F;--bg:#f4f6f8;--card:#fff;--muted:#65717d;--border:#dfe4e8}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#17212b}
header{background:var(--blue);color:#fff;padding:22px 18px 18px;position:sticky;top:0;z-index:10}
header h1{margin:0 0 5px;font-size:23px}header p{margin:0;opacity:.82;font-size:14px}
main{max-width:850px;margin:auto;padding:14px 14px 90px}
.toolbar{display:grid;gap:9px;margin-bottom:12px}
input,select,button{font:inherit}
input,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;background:#fff}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row{display:flex;justify-content:space-between;align-items:center;margin:12px 2px}
.count{font-size:13px;color:var(--muted)}.favOnly{border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 11px}
.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card h2{font-size:17px;margin:0 36px 5px 0}.activity{font-size:14px;color:var(--blue);font-weight:600}.meta{font-size:13px;color:var(--muted);margin-top:5px}
.cardtop{position:relative}.star{position:absolute;right:0;top:-4px;border:0;background:none;font-size:28px;cursor:pointer}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.actions a,.actions button{border:1px solid var(--border);border-radius:9px;padding:9px 11px;background:#fff;text-decoration:none;color:var(--blue);font-weight:600}
.detail{display:none}.detail.active{display:block}.list.hidden{display:none}
.back{border:0;background:none;padding:4px 0;color:var(--blue);font-weight:700;font-size:15px}
.detail h2{font-size:22px;margin:8px 0}.label{font-size:12px;color:var(--muted);margin-top:15px}.value{font-size:15px;margin-top:3px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:center;gap:40px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));z-index:20}
nav button{border:0;background:none;color:var(--blue);font-weight:700}.empty{text-align:center;color:var(--muted);padding:35px 10px}
@media(min-width:700px){.toolbar{grid-template-columns:2fr 1fr 1fr}.filters{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>PFMP Stage</h1><p>Prototype — recherche d'entreprises</p></header>
<main>
<section id="listView" class="list">
  <div class="toolbar">
    <input id="q" placeholder="🔎 Rechercher une entreprise ou une activité">
    <select id="city"><option value="">Toutes les villes</option></select>
    <select id="activity"><option value="">Tous les secteurs</option></select>
  </div>
  <div class="filters">
    <select id="sort"><option value="name">Trier : nom</option><option value="city">Trier : ville</option><option value="activity">Trier : secteur</option></select>
    <button class="favOnly" id="favOnly">☆ Mes favoris uniquement</button>
  </div>
  <div class="row"><span class="count" id="count"></span><button class="favOnly" id="reset">Réinitialiser</button></div>
  <div id="cards"></div>
</section>

<section id="detailView" class="detail">
  <button class="back" id="back">← Retour à la liste</button>
  <div id="detail"></div>
</section>
</main>
<nav><button id="homeBtn">🏠 Entreprises</button><button id="favoritesBtn">⭐ Favoris</button></nav>

const cities = ["BEAUMONT DE LOMAGNE", "CASTELSARRASIN", "FENOUILLET", "MOISSAC", "MONTAUBAN", "SAINT NICOLAS DE LA GRAVE"];
const activities = ["Agence Immobilière", "Concession automobile", "Grande surface alimentaire (supermarché)", "Grande surface de bricolage"];
let favorites = JSON.parse(localStorage.getItem("pfmp-favorites") || "[]");
let favMode = false;

const $ = id => document.getElementById(id);
cities.forEach(x=>{let o=document.createElement("option");o.value=x;o.textContent=x;$("city").appendChild(o)});
activities.forEach(x=>{let o=document.createElement("option");o.value=x;o.textContent=x;$("activity").appendChild(o)});

function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function isFav(id){return favorites.includes(id)}
function save(){localStorage.setItem("pfmp-favorites",JSON.stringify(favorites))}
function toggleFav(id){favorites=isFav(id)?favorites.filter(x=>x!==id):[...favorites,id];save();render()}

function render(){
 let q=$("q").value.trim().toLowerCase(), city=$("city").value, act=$("activity").value;
 let a=companies.filter(c=>(!q || [c.name,c.activity,c.address,c.city].join(" ").toLowerCase().includes(q))&&(!city||c.city===city)&&(!act||c.activity===act)&&(!favMode||isFav(c.id)));
 a.sort((x,y)=>{let k=$("sort").value;return String(x[k]||"").localeCompare(String(y[k]||""),"fr")});
 $("count").textContent=`${a.length} entreprise${a.length>1?"s":""}`;
 $("cards").innerHTML=a.length?a.map(c=>`<article class="card"><div class="cardtop"><button class="star" onclick="toggleFav(${c.id})" aria-label="favori">${isFav(c.id)?"★":"☆"}</button><h2>${esc(c.name)}</h2><div class="activity">${esc(c.activity)}</div><div class="meta">📍 ${esc(c.city)} ${esc(c.postal)}</div></div><div class="actions"><button onclick="openDetail(${c.id})">Voir la fiche</button>${c.phone?`<a href="tel:${esc(c.phone)}">📞 Appeler</a>`:""}</div></article>`).join(""):`<div class="empty">Aucune entreprise ne correspond aux critères.</div>`;
}
function openDetail(id){
 let c=companies.find(x=>x.id===id); if(!c)return;
 $("listView").classList.add("hidden");$("detailView").classList.add("active");
 let maps=c.lat&&c.lon?`https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lon}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.address)}`;
 $("detail").innerHTML=`<div class="card"><div class="cardtop"><button class="star" onclick="toggleFav(${c.id});openDetail(${c.id})">${isFav(c.id)?"★":"☆"}</button><h2>${esc(c.name)}</h2><div class="activity">${esc(c.activity)}</div></div>
 <div class="label">Adresse</div><div class="value">${esc(c.address)}</div>
 <div class="label">Responsable</div><div class="value">${esc(c.responsible)||"Non renseigné"}</div>
 <div class="label">Téléphone</div><div class="value">${c.phone?`<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>`:"Non renseigné"}</div>
 <div class="label">E-mail</div><div class="value">${c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:"Non renseigné"}</div>
 <div class="label">Site internet</div><div class="value">${c.website?`<a target="_blank" rel="noopener" href="${esc(c.website.match(/^https?:\\/\\//)?c.website:"https://"+c.website)}">Ouvrir le site</a>`:"Non renseigné"}</div>
 <div class="actions"><a target="_blank" rel="noopener" href="${maps}">📍 Voir sur la carte</a>${c.phone?`<a href="tel:${esc(c.phone)}">📞 Appeler</a>`:""}</div></div>`;
 window.scrollTo(0,0);
}
$("back").onclick=()=>{$("detailView").classList.remove("active");$("listView").classList.remove("hidden");render()}
$("homeBtn").onclick=()=>{$("detailView").classList.remove("active");$("listView").classList.remove("hidden");favMode=false;render()}
$("favoritesBtn").onclick=()=>{$("detailView").classList.remove("active");$("listView").classList.remove("hidden");favMode=true;render()}
$("favOnly").onclick=()=>{favMode=!favMode;$("favOnly").textContent=favMode?"★ Tous les résultats":"☆ Mes favoris uniquement";render()}
["q","city","activity","sort"].forEach(id=>$(id).addEventListener("input",render));
$("reset").onclick=()=>{$("q").value="";$("city").value="";$("activity").value="";$("sort").value="name";favMode=false;$("favOnly").textContent="☆ Mes favoris uniquement";render()}
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
